<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" role="img" aria-labelledby="title desc">
  <title id="title">JetsonFabric quality and throughput tradeoff</title>
  <desc id="desc">HumanEval Plus pass at one increases with model size while fixed-output throughput decreases.</desc>
  <rect width="960" height="456" fill="#ffffff"/>
